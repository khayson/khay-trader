[project]
name = "khay-trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML",
    "pre-commit>=3", "detect-secrets>=1.5",
]

[project.scripts]
trader-backfill = "trader.data.fetch:main"
trader-backtest = "trader.backtest.report:main"
trader-research = "trader.backtest.research:main"
trader-killswitch = "trader.risk.killswitch:main"
trader-run = "trader.loop:main"
trader-status = "trader.loop:status_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long real-data replays; run `pytest -m slow` before every merge to main"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true
