mode: paper                 # paper | live  (live requires explicit flag + env var)
exchange: binance           # ccxt exchange id; public endpoints only for data
pairs: [BTC/USDT, ETH/USDT]
timeframe: 1h
fees_per_side: 0.001        # 0.10%
slippage_per_side: 0.0005   # 0.05%
risk:
  max_drawdown_pct: 10      # from equity peak -> kill switch trips (~1.5x v1's worst backtest DD)
  max_position_pct: 10      # per pair, of equity
  max_total_exposure_pct: 20
  max_daily_loss_pct: 2
  risk_per_trade_pct: 0.5
  max_orders_per_hour: 6
  stale_data_seconds: 180   # act on a closed bar only within this many seconds of its close
  max_consecutive_api_errors: 5   # kill switch trips after this many in a row
  killswitch_state: data/state/killswitch.json  # missing or corrupt = tripped (fail closed)
  flatten_on_trip: true     # on trip: market-sell positions, cancel each stop after its sell fills
features:
  ema_fast: 50
  ema_slow: 200
  atr_period: 14            # Wilder smoothing
  vol_window_hours: 168     # realized volatility of 1-bar log returns
  drawdown_window_hours: 168 # rolling peak for drawdown
  channel_entry: 55         # bars, prior-high breakout channel
  channel_exit: 20          # bars, prior-low exit channel
strategy:                   # baseline, SPEC section 5. Defaults chosen a priori, not tuned.
  atr_pct_min: 0.2          # ATR as % of close; below = dead market
  atr_pct_max: 3.0          # above = disorderly market
  stop_atr_mult: 3.0        # initial and trailing stop distance, in ATRs
paper:
  stop_slippage: 0.0015     # stop-market fills (3x the 0.05% model; see reports/stop_slippage_sensitivity.md)
  strategy_protocol: config/research_round1.yaml  # strategy v1 = candidate A (frozen)
  strategy_candidate: A
  known_gaps: config/known_gaps.yaml
  initial_equity: 10000
  data_dir: data            # 1h candle store, shared with research
  db: data/paper/paper.db   # SQLite journal (gitignored with data/)
  lock: data/paper/trader.lock
  log_dir: data/paper/logs
  history_hours: 2600       # minimum 1h history kept fresh (warmup is 500 4h bars = 2000h)
  wake_delay_seconds: 5     # after each 4h bar close
  parity_bars: 30           # recent bars checked against native 4h klines each wake
  divergence_min_fills: 10
  divergence_slippage_mult: 3
