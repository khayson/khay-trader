mode: paper                 # paper | live  (live requires explicit flag + env var)
exchange: binance           # ccxt exchange id; public endpoints only for data
pairs: [BTC/USDT, ETH/USDT]
timeframe: 1h
fees_per_side: 0.001        # 0.10%
slippage_per_side: 0.0005   # 0.05%
risk:
  max_drawdown_pct: 15      # from equity peak -> kill switch trips
  max_position_pct: 10      # per pair, of equity
  max_total_exposure_pct: 20
  max_daily_loss_pct: 2
  risk_per_trade_pct: 0.5
  max_orders_per_hour: 6
  stale_data_seconds: 180   # no trading on stale data
features:
  ema_fast: 50
  ema_slow: 200
  atr_period: 14            # Wilder smoothing
  vol_window_hours: 168     # realized volatility of 1-bar log returns
  drawdown_window_hours: 168 # rolling peak for drawdown
  channel_entry: 55         # bars, prior-high breakout channel
  channel_exit: 20          # bars, prior-low exit channel
strategy:                   # baseline, SPEC section 5. Defaults chosen a priori, not tuned.
  atr_pct_min: 0.2          # ATR as % of close; below = dead market
  atr_pct_max: 3.0          # above = disorderly market
  stop_atr_mult: 3.0        # initial and trailing stop distance, in ATRs
